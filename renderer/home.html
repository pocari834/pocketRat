<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>鼠宝的家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    .home-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top-bar {
      height: 36px;
      background: #8D6E63;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      border-bottom: 2px solid #6D4C41;
    }
    .top-bar .title {
      color: #FFF9C4;
      font-size: 13px;
      font-weight: bold;
    }
    .top-bar .coins {
      color: #FFD54F;
      font-size: 13px;
    }
    .top-bar .close-btn {
      width: 20px;
      height: 20px;
      background: #E57373;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-bar .close-btn:hover { background: #EF5350; }

    /* Stats bar */
    .stats-bar {
      height: 28px;
      background: #EFEBE9;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 16px;
      font-size: 12px;
      color: #5D4037;
      border-bottom: 1px solid #D7CCC8;
    }
    .stat-item { display: flex; align-items: center; gap: 4px; }

    /* Main area */
    .main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Room canvas area */
    .room-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EFEBE9;
      position: relative;
    }
    #room-canvas {
      border: 3px solid #8D6E63;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Side panel */
    .side-panel {
      width: 160px;
      background: #FFF8E1;
      border-left: 2px solid #D7CCC8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-tabs {
      display: flex;
      height: 32px;
      border-bottom: 1px solid #D7CCC8;
    }
    .panel-tab {
      flex: 1;
      border: none;
      background: #EFEBE9;
      font-size: 11px;
      cursor: pointer;
      color: #5D4037;
      transition: background 0.2s;
    }
    .panel-tab.active {
      background: #FFF8E1;
      font-weight: bold;
    }
    .panel-tab:hover { background: #FFF3E0; }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .shop-item, .inventory-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      margin-bottom: 4px;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #E0E0E0;
      transition: border-color 0.2s;
    }
    .shop-item:hover, .inventory-item:hover {
      border-color: #FF8A65;
    }
    .shop-item.selected, .inventory-item.selected {
      border-color: #FF6347;
      background: #FFF3E0;
    }
    .item-preview {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 11px;
      font-weight: bold;
      color: #3E2723;
    }
    .item-desc {
      font-size: 9px;
      color: #8D6E63;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-price {
      font-size: 10px;
      color: #FF8F00;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Bottom bar */
    .bottom-bar {
      height: 36px;
      background: #8D6E63;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border-top: 2px solid #6D4C41;
    }
    .bottom-btn {
      padding: 4px 12px;
      border: none;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-call-pet {
      background: #FFE082;
      color: #5D4037;
    }
    .btn-call-pet:hover { background: #FFD54F; }
    .btn-call-pet.pet-home { background: #A5D6A7; }
    .btn-call-pet.pet-home:hover { background: #81C784; }
    .btn-remove-mode {
      background: #FFAB91;
      color: #5D4037;
    }
    .btn-remove-mode:hover { background: #FF8A65; }
    .btn-remove-mode.active { background: #E57373; color: white; }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="top-bar">
      <span class="title">🏠 鼠宝的家</span>
      <span class="coins">🪙 <span id="coins-display">50</span></span>
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <div class="stats-bar">
      <div class="stat-item">😊 快乐 +<span id="stat-happiness">0</span></div>
      <div class="stat-item">🛏️ 舒适 +<span id="stat-comfort">0</span></div>
    </div>
    <div class="main-area">
      <div class="room-area">
        <canvas id="room-canvas" width="420" height="280"></canvas>
      </div>
      <div class="side-panel">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="shop">商店</button>
          <button class="panel-tab" data-tab="inventory">仓库</button>
        </div>
        <div class="panel-content" id="panel-content"></div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="bottom-btn btn-call-pet" id="btn-call-pet">🐹 叫鼠宝回家</button>
      <button class="bottom-btn btn-remove-mode" id="btn-remove-mode">🗑️ 收起家具</button>
    </div>
  </div>

  <script src="./js/home-system.js"></script>
  <script src="./js/home-renderer.js"></script>
</body>
</html>
