<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'">
  <title>Pocket Rat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 200px;
      height: 200px;
      overflow: visible;
      background: transparent;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    #canvas {
      width: 200px;
      height: 200px;
    }
    /* Speech bubble */
    #bubble {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #333;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-family: 'Segoe UI', sans-serif;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #bubble.show { opacity: 1; }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }

    /* Stats bars */
    #stats-panel {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 100px;
    }
    #stats-panel.show { opacity: 1; }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stat-icon { font-size: 12px; width: 16px; text-align: center; }
    .stat-bar-bg {
      flex: 1;
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      overflow: visible;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .stat-bar-fill.hunger { background: #FF9800; }
    .stat-bar-fill.mood   { background: #E91E63; }
    .stat-bar-fill.energy { background: #2196F3; }
    .stat-val { width: 22px; text-align: right; color: #666; font-size: 9px; }

    /* Custom context menu */
    #ctx-menu {
      position: fixed;
      position: absolute;
      display: none;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      padding: 4px 0;
      z-index: 100;
      min-width: 120px;
      font-size: 12px;
      font-family: 'Segoe UI', sans-serif;
    }
    #ctx-menu .ctx-item {
      padding: 6px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctx-menu .ctx-item:hover {
      background: #F0F0F0;
    }
    #ctx-menu .ctx-sep {
      height: 1px;
      background: #E0E0E0;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="200" height="200"></canvas>
  <video id="dance-video" width="200" height="200" preload="auto" playsinline style="position:absolute;top:0;left:0;width:200px;height:200px;object-fit:contain;display:none;pointer-events:none;z-index:10;"></video>
  <div id="stats-panel">
    <div class="stat-row"><span class="stat-icon">🍔</span><div class="stat-bar-bg"><div id="stat-hunger-fill" class="stat-bar-fill hunger" style="width:100%"></div></div><span id="stat-hunger-val" class="stat-val">100</span></div>
    <div class="stat-row"><span class="stat-icon">😊</span><div class="stat-bar-bg"><div id="stat-mood-fill" class="stat-bar-fill mood" style="width:100%"></div></div><span id="stat-mood-val" class="stat-val">100</span></div>
    <div class="stat-row"><span class="stat-icon">⚡</span><div class="stat-bar-bg"><div id="stat-energy-fill" class="stat-bar-fill energy" style="width:100%"></div></div><span id="stat-energy-val" class="stat-val">100</span></div>
  </div>
  <div id="bubble"></div>
<div id="ctx-menu">
    <div class="ctx-item" data-action="home">🐹 鼠宝的家</div>
    <div class="ctx-item" data-action="feed">🧀 喂食</div>
    <div class="ctx-item" data-action="game">🎾 追光标</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="settings">⚙️ 设置</div>
  </div>
  <script src="./js/renderer.js"></script>
  <script src="./js/state-machine.js"></script>
  <script src="./js/interaction.js"></script>
  <script src="./js/work-mode.js"></script>
  <script src="./js/mini-games.js"></script>
  <script src="./js/pet-stats.js"></script>
  <script src="./js/pet.js"></script>

</body>
</html>
